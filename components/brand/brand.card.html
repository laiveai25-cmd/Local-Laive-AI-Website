<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; }
  body { background: var(--bg); background-image: var(--grad-halo); color: var(--text); font-family: var(--font-body); padding: 30px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch; }
  .cell { flex: 1 1 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 22px 14px; border-radius: var(--radius-md); background: var(--glass-bg-2); border: 1px solid var(--glass-border); }
  .cell.dark { background: #fff; }
  .cap { font-family: var(--font-display); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-subtle); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Logo } = window.LaiveAIDesignSystem_fa5676;
  const B = '../../assets/';
  function Demo() {
    return (
      <div className="grid">
        <div className="cell"><Logo base={B} variant="3d" layout="mark" size={100} glow /><span className="cap">3D Copper</span></div>
        <div className="cell"><Logo base={B} variant="gold" layout="mark" size={92} /><span className="cap">Gold Mark</span></div>
        <div className="cell dark"><Logo base={B} variant="black" layout="mark" size={92} /><span className="cap" style={{color:'#666'}}>On Light</span></div>
        <div className="cell"><Logo base={B} variant="wordmark" size={200} /><span className="cap">Wordmark</span></div>
        <div className="cell" style={{ flex: '1 1 260px' }}><Logo base={B} variant="gold" layout="lockup" size={110} /><span className="cap">Full Lockup</span></div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
