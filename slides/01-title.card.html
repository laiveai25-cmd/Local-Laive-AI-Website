<!-- @dsCard group="Slides" viewport="1280x720" name="Title Slide" subtitle="Cover — 3D logo, tagline" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--ink-950);color:var(--text);font-family:var(--font-body);display:flex;align-items:center}
  .halo{position:absolute;inset:0;background:radial-gradient(80% 70% at 78% 30%,rgba(232,179,23,.26),transparent 60%)}
  .grid{position:absolute;inset:0;opacity:.5;mask-image:radial-gradient(70% 70% at 70% 40%,#000,transparent);-webkit-mask-image:radial-gradient(70% 70% at 70% 40%,#000,transparent)}
  .in{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:0 90px;width:100%;box-sizing:border-box}
  .eye{font-family:var(--font-display);font-size:15px;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
  h1{font-family:var(--font-heading);font-weight:800;font-size:66px;line-height:1.05;letter-spacing:-.02em;color:var(--text-strong);margin:18px 0}
  p{font-size:21px;color:var(--text-muted);max-width:460px;line-height:1.5}
  .mark{position:relative;display:grid;place-items:center}
  .mark .glow{position:absolute;inset:-14%;background:radial-gradient(circle,rgba(232,179,23,.3),transparent 62%)}
  .foot{position:absolute;bottom:44px;left:90px;display:flex;gap:16px;align-items:center;font-family:var(--font-display);letter-spacing:.08em;color:var(--text-muted);font-size:16px}
  .hex{width:18px;height:20px;clip-path:var(--hex-clip);background:var(--grad-gold)}
</style></head>
<body>
<div class="slide">
  <div class="halo"></div><div class="grid bg-grid"></div>
  <div class="in">
    <div>
      <div class="eye">AI-Native IT Advisory &amp; Implementation</div>
      <h1>Built to help you <span class="text-gradient-gold">lead.</span></h1>
      <p>Powered by data. Driven by AI. We turn AI into a competitive advantage that delivers measurable results.</p>
    </div>
    <div class="mark"><div class="glow"></div><img src="../assets/mark-3d-copper.png" alt="Laive AI" style="position:relative;width:360px;filter:drop-shadow(0 30px 50px rgba(0,0,0,.6))" /></div>
  </div>
  <div class="foot"><span class="hex"></span>LAIVE AI · laiveai.com</div>
</div>
</body></html>
