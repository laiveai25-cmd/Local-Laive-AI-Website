<!-- @dsCard group="Slides" viewport="1280x720" name="Stat Slide" subtitle="Big proof-point metric" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  .slide{width:1280px;height:720px;position:relative;overflow:hidden;background:var(--ink-950);color:var(--text);font-family:var(--font-body);box-sizing:border-box;padding:90px}
  .grain{position:absolute;inset:0;opacity:.24}
  .halo{position:absolute;inset:0;background:radial-gradient(60% 60% at 30% 50%,rgba(232,179,23,.2),transparent 62%)}
  .in{position:relative;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}
  .eye{font-family:var(--font-display);font-size:15px;letter-spacing:.22em;color:var(--accent)}
  h1{font-family:var(--font-heading);font-weight:800;font-size:48px;letter-spacing:-.02em;color:var(--text-strong);margin:16px 0 20px;line-height:1.1}
  p{font-size:22px;color:var(--text-muted);line-height:1.55;max-width:480px}
  .big{font-family:var(--font-display);font-size:260px;line-height:.85;text-align:center}
  .row{display:flex;gap:40px;margin-top:34px}
  .s .v{font-family:var(--font-display);font-size:44px}
  .s .l{font-size:15px;color:var(--text-subtle)}
</style></head>
<body>
<div class="slide">
  <div class="grain bg-copper-grain"></div><div class="halo"></div>
  <div class="in">
    <div>
      <div class="eye">WHY CHOOSE LAIVE AI</div>
      <h1>Outcome-driven,<br/>not tool-driven.</h1>
      <p>You get AI-driven capabilities without recruiting new talent — and realize up to 50–60% ROI.</p>
      <div class="row">
        <div class="s"><div class="v text-gradient-gold">24/7</div><div class="l">Always-on agents</div></div>
        <div class="s"><div class="v text-gradient-gold">0</div><div class="l">Hiring burden</div></div>
        <div class="s"><div class="v text-gradient-gold">3</div><div class="l">AI products</div></div>
      </div>
    </div>
    <div class="big text-3d-copper">60%</div>
  </div>
</div>
</body></html>
