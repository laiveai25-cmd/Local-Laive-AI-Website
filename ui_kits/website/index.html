<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laive AI — Website</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; background: var(--bg); }
  body { font-family: var(--font-body); color: var(--text); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; }
  @media (max-width: 900px) {
    .hero-grid, .contact-grid { grid-template-columns: 1fr !important; }
    .products-grid, .why-grid, .process-grid { grid-template-columns: 1fr !important; }
    .nav-links { display: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="site.jsx"></script>
<script type="text/babel">
  const mount = () => {
    if (window.SiteApp) {
      const SiteApp = window.SiteApp;
      ReactDOM.createRoot(document.getElementById('root')).render(<SiteApp />);
    } else { setTimeout(mount, 40); }
  };
  mount();
</script>
</body>
