<!-- @dsCard group="Colors" viewport="700x160" name="Ink — Neutrals" subtitle="Warm-tinted near-blacks for surfaces & text" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-soft)}
  .sw{flex:1;height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px}
  .n{font-family:var(--font-mono);font-size:10px;font-weight:700}
  .h{font-family:var(--font-mono);font-size:9px;opacity:.7}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--white)"><span class="n" style="color:#111">white</span></div>
  <div class="sw" style="background:var(--ink-100)"><span class="n" style="color:#111">100</span></div>
  <div class="sw" style="background:var(--ink-300)"><span class="n" style="color:#111">300</span></div>
  <div class="sw" style="background:var(--ink-500)"><span class="n" style="color:#fff">500</span></div>
  <div class="sw" style="background:var(--ink-700)"><span class="n" style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--ink-800)"><span class="n" style="color:#fff">800·surface</span></div>
  <div class="sw" style="background:var(--ink-850)"><span class="n" style="color:#fff">850</span></div>
  <div class="sw" style="background:var(--ink-900)"><span class="n" style="color:#fff">900·bg</span></div>
  <div class="sw" style="background:var(--ink-950)"><span class="n" style="color:#fff">950</span></div>
</div>
</body></html>
