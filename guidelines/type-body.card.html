<!-- @dsCard group="Type" viewport="700x210" name="Body & Scale" subtitle="Sora body copy + the type scale" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:24px;display:flex;gap:28px}
  p{margin:0;max-width:340px;line-height:1.65;color:var(--text-muted)}
  .scale div{display:flex;align-items:baseline;gap:12px;margin-bottom:7px}
  .scale .k{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle);width:38px}
  .scale .v{font-family:var(--font-heading);font-weight:600;color:var(--text)}
</style></head>
<body>
  <div>
    <p style="font-size:16px;margin-bottom:12px">We are an AI-native IT advisory &amp; implementation firm that helps organisations operate faster, sell smarter, and support customers better.</p>
    <p style="font-size:13px;color:var(--text-subtle)">Small print — 14/13px for captions, meta, and secondary UI text.</p>
  </div>
  <div class="scale">
    <div><span class="k">xs</span><span class="v" style="font-size:12px">12</span></div>
    <div><span class="k">sm</span><span class="v" style="font-size:14px">14</span></div>
    <div><span class="k">base</span><span class="v" style="font-size:16px">16</span></div>
    <div><span class="k">xl</span><span class="v" style="font-size:20px">20</span></div>
    <div><span class="k">2xl</span><span class="v" style="font-size:24px">24</span></div>
    <div><span class="k">4xl</span><span class="v" style="font-size:34px">38</span></div>
  </div>
</body></html>
