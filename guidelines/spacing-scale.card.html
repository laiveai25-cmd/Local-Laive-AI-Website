<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:24px;display:flex;align-items:flex-end;gap:14px}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:var(--grad-gold);border-radius:4px;width:26px}
  .k{font-family:var(--font-mono);font-size:9.5px;color:var(--text-subtle)}
</style></head>
<body>
  <div class="b"><div class="bar" style="height:8px"></div><span class="k">2·8</span></div>
  <div class="b"><div class="bar" style="height:16px"></div><span class="k">4·16</span></div>
  <div class="b"><div class="bar" style="height:24px"></div><span class="k">6·24</span></div>
  <div class="b"><div class="bar" style="height:32px"></div><span class="k">8·32</span></div>
  <div class="b"><div class="bar" style="height:48px"></div><span class="k">12·48</span></div>
  <div class="b"><div class="bar" style="height:64px"></div><span class="k">16·64</span></div>
  <div class="b"><div class="bar" style="height:80px"></div><span class="k">20·80</span></div>
  <div class="b"><div class="bar" style="height:96px"></div><span class="k">24·96</span></div>
</body></html>
