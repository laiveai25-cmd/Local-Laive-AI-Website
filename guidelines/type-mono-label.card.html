<!-- @dsCard group="Type" viewport="700x150" name="Mono & Labels" subtitle="Space Mono for data + the Michroma eyebrow" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:24px;display:flex;flex-direction:column;gap:18px}
  .mono{font-family:var(--font-mono);font-size:15px;color:var(--text)}
  .mono .g{color:var(--accent)}
  .lab{font-family:var(--font-display);font-size:12px;letter-spacing:0.22em;text-transform:uppercase;color:var(--accent);display:inline-flex;align-items:center;gap:10px}
  .hex{width:9px;height:10px;background:var(--accent);clip-path:var(--hex-clip);box-shadow:0 0 10px rgba(232,179,23,.5)}
</style></head>
<body>
  <div class="mono">ROI <span class="g">+58%</span> · latency <span class="g">120ms</span> · uptime <span class="g">99.9%</span></div>
  <div class="lab"><span class="hex"></span>Our AI Products</div>
  <div class="lab"><span class="hex"></span>How We Work</div>
</body></html>
