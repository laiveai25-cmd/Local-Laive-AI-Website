<!-- @dsCard group="Colors" viewport="700x150" name="Copper & 3D" subtitle="Textured-logo tones for 3D & extruded treatments" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px;display:flex;gap:16px;align-items:stretch}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md);flex:1}
  .sw{flex:1;height:100px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font-family:var(--font-mono);font-size:10px;font-weight:700}
  .h{font-family:var(--font-mono);font-size:9.5px;opacity:.75}
  .grain{flex:0 0 130px;border-radius:var(--radius-md);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:#fbe6cd}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--brand-copper-lite)"><span class="n" style="color:#2b1408">lite</span><span class="h" style="color:#2b1408">#D9944A</span></div>
  <div class="sw" style="background:var(--brand-copper)"><span class="n" style="color:#fff">copper</span><span class="h" style="color:#fff">#B06A2E</span></div>
  <div class="sw" style="background:var(--brand-copper-deep)"><span class="n" style="color:#fff">deep</span><span class="h" style="color:#fff">#6B3A18</span></div>
</div>
<div class="grain bg-copper-grain">micro-grain</div>
</body></html>
