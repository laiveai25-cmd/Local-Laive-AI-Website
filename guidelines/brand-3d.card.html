<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:26px;display:flex;gap:18px;align-items:center}
  .btn3d{padding:15px 26px;border-radius:var(--radius-md);background:var(--grad-gold);color:var(--text-on-gold);font-family:var(--font-heading);font-weight:600;font-size:15px;border:1px solid rgba(255,255,255,.18);box-shadow:var(--shadow-3d-gold)}
  .word{font-family:var(--font-display);font-size:34px}
  .bx{flex:1;height:90px;border-radius:var(--radius-md);display:grid;place-items:center;font-family:var(--font-mono);font-size:10px}
</style></head>
<body>
  <div class="btn3d">Book a demo</div>
  <div class="word text-3d-copper">VALUE</div>
  <div class="bx bg-grid" style="border:1px solid var(--border)">bg-grid</div>
  <div class="bx bg-dots" style="border:1px solid var(--border)">bg-dots</div>
</body></html>
