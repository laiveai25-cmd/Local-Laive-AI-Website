<!-- @dsCard group="Colors" viewport="700x150" name="Gold — Primary" subtitle="The signature Laive gold scale (anchored to #E8B317)" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-md)}
  .sw{flex:1;height:96px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
  .n{font-family:var(--font-mono);font-size:10px;font-weight:700}
  .h{font-family:var(--font-mono);font-size:9.5px;opacity:.7}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--gold-100)"><span class="n" style="color:#3a2c09">100</span><span class="h" style="color:#3a2c09">#F7E9AE</span></div>
  <div class="sw" style="background:var(--gold-200)"><span class="n" style="color:#3a2c09">200</span><span class="h" style="color:#3a2c09">#F1D971</span></div>
  <div class="sw" style="background:var(--gold-300)"><span class="n" style="color:#3a2c09">300</span><span class="h" style="color:#3a2c09">#EDC93B</span></div>
  <div class="sw" style="background:var(--gold-400)"><span class="n" style="color:#17130a">400 ★</span><span class="h" style="color:#17130a">#E8B317</span></div>
  <div class="sw" style="background:var(--gold-500)"><span class="n" style="color:#17130a">500</span><span class="h" style="color:#17130a">#CE9C12</span></div>
  <div class="sw" style="background:var(--gold-600)"><span class="n" style="color:#fff">600</span><span class="h" style="color:#fff">#AE830F</span></div>
  <div class="sw" style="background:var(--gold-700)"><span class="n" style="color:#fff">700</span><span class="h" style="color:#fff">#86650E</span></div>
  <div class="sw" style="background:var(--gold-800)"><span class="n" style="color:#fff">800</span><span class="h" style="color:#fff">#5C470C</span></div>
</div>
</body></html>
