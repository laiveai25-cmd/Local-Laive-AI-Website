<!-- @dsCard group="Colors" viewport="700x150" name="Semantic — Status" subtitle="Success, warning, danger & info" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-body);padding:20px;display:flex;gap:14px}
  .c{flex:1;border-radius:var(--radius-md);padding:16px;border:1px solid var(--border-soft);display:flex;flex-direction:column;gap:10px}
  .dot{width:26px;height:26px;border-radius:999px}
  .lab{font-family:var(--font-heading);font-weight:600;font-size:13px}
  .h{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
  .pill{align-self:flex-start;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px}
</style></head>
<body>
  <div class="c"><div class="dot" style="background:var(--success);box-shadow:0 0 12px var(--success)"></div><span class="lab">Success</span><span class="h">#4FB477</span><span class="pill" style="background:var(--success-bg);color:var(--success)">Live 24/7</span></div>
  <div class="c"><div class="dot" style="background:var(--warning);box-shadow:0 0 12px var(--warning)"></div><span class="lab">Warning</span><span class="h">#E8B317</span><span class="pill" style="background:var(--warning-bg);color:var(--warning)">Action</span></div>
  <div class="c"><div class="dot" style="background:var(--danger);box-shadow:0 0 12px var(--danger)"></div><span class="lab">Danger</span><span class="h">#E5533D</span><span class="pill" style="background:var(--danger-bg);color:var(--danger)">Error</span></div>
  <div class="c"><div class="dot" style="background:var(--info);box-shadow:0 0 12px var(--info)"></div><span class="lab">Info</span><span class="h">#4C8DD6</span><span class="pill" style="background:var(--info-bg);color:var(--info)">Note</span></div>
</body></html>
